name: Release Sonochka Study 14.2.1
on:
  push:
    paths:
      - '.github/workflows/release-v14.2.1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified base and apply update
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/sicinsane/SonochkaStudy/releases/download/v14.2.0/SonochkaStudy-update.zip' -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash -ne 'f9cb7154f8a21d87c2dc63c30ddcf517e850660fa414312b3c6f08d184de7a94') { throw 'Base checksum mismatch' }
          Expand-Archive base.zip app
          python patch-14.2.1.py
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade failed' }
          Copy-Item release-notes/v14.2.1.md app/CHANGELOG-14.2.1.md
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path app/SonochkaStudy.exe))
          $pe=[BitConverter]::ToInt32($bytes,60)
          if($bytes[0] -ne 77 -or $bytes[1] -ne 90 -or [BitConverter]::ToInt32($bytes,$pe) -ne 17744 -or [BitConverter]::ToUInt16($bytes,$pe+24+68) -ne 2){throw 'Invalid Windows GUI EXE'}
          foreach($file in Get-ChildItem app/*.ps1){$t=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$t,[ref]$errors)|Out-Null;if($errors){throw $errors}}
          Compress-Archive -Path app/* -DestinationPath SonochkaStudy-update.zip
          Copy-Item SonochkaStudy-update.zip SonochkaStudy-v14.2.1-portable.zip
      - name: Publish release and update channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v14.2.1 SonochkaStudy-update.zip SonochkaStudy-v14.2.1-portable.zip --title 'Соночка Study v14.2.1 — Яндекс Браузер и обложки' --notes-file release-notes/v14.2.1.md --latest
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
          $hash=(Get-FileHash SonochkaStudy-update.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @{version='14.2.1';packageUrl='https://github.com/sicinsane/SonochkaStudy/releases/download/v14.2.1/SonochkaStudy-update.zip';sha256=$hash;notes=[IO.File]::ReadAllText((Resolve-Path release-notes/v14.2.1.md))} | ConvertTo-Json | Set-Content stable.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stable.json
          git commit -m 'Publish stable update channel 14.2.1'
          git push
          if($LASTEXITCODE -ne 0){throw 'Channel update failed'}

