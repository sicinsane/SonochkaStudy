name: Build and publish Sonochka Study 14.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-v14.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/app
          cd build
          curl -fL --retry 3 -o base.zip "https://github.com/sicinsane/SonochkaStudy/releases/download/v14.1.0/SonochkaStudy-update.zip"
          unzip -q base.zip -d app
          cd app

          tr -d '\r\n' < "$GITHUB_WORKSPACE/release-tools/SonochkaStudy.exe.b64" | base64 -d > SonochkaStudy.exe
          test "$(stat -c%s SonochkaStudy.exe)" = "2560"
          test "$(sha256sum SonochkaStudy.exe | cut -d' ' -f1)" = "84bef3c53885d9e5b6d186c3db0b408ca53e84bd3ac8e61b25d66fb8de36a58d"
          file SonochkaStudy.exe | grep -q 'PE32+'

          cat > SonaStudy.cmd <<'EOF'
          @echo off
          setlocal
          set "ROOT=%~dp0"
          if exist "%ROOT%SonochkaStudy.exe" (
            start "" "%ROOT%SonochkaStudy.exe"
            exit /b
          )
          powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "%ROOT%Launch.ps1"
          EOF
          sed -i 's/^          //' SonaStudy.cmd

          python3 - <<'PY'
          from pathlib import Path

          html=Path('SonaStudy.html')
          s=html.read_text(encoding='utf-8')
          s=s.replace("const APP_VERSION='14.1.0';","const APP_VERSION='14.1.2';")
          s=s.replace('id="updateVersionBadge">v14.1.0<','id="updateVersionBadge">v14.1.2<')
          html.write_text(s,encoding='utf-8')

          up=Path('SonaUpdater.ps1')
          s=up.read_text(encoding='utf-8')
          marker="if (-not (Test-Path -LiteralPath (Join-Path $root 'version.txt'))) { throw 'Пакет обновления неполный: нет version.txt.' }"
          extra=marker+"\n  if (-not (Test-Path -LiteralPath (Join-Path $root 'SonochkaStudy.exe'))) { throw 'Пакет обновления неполный: нет SonochkaStudy.exe.' }\n  if (-not (Test-Path -LiteralPath (Join-Path $root 'SonaStudy.cmd'))) { throw 'Пакет обновления неполный: нет SonaStudy.cmd.' }"
          if "нет SonochkaStudy.exe" not in s:
              s=s.replace(marker,extra)
          old="@('SonaStudy.html','SonaMusicBridge.ps1','Launch.ps1','SonaUpdater.ps1','version.txt','startup-chime.wav')"
          new="@('SonaStudy.html','SonaMusicBridge.ps1','Launch.ps1','SonaUpdater.ps1','version.txt','startup-chime.wav','SonochkaStudy.exe','SonaStudy.cmd')"
          s=s.replace(old,new)
          up.write_text(s,encoding='utf-8')
          PY

          printf '14.1.2\n' > version.txt
          cat > CHANGELOG-14.1.2.md <<'EOF'
          # Соночка Study 14.1.2

          Критический hotfix запуска и обновления.

          - в релиз включён проверенный 64-битный SonochkaStudy.exe;
          - update ZIP содержит EXE и SonaStudy.cmd;
          - перед публикацией GitHub Actions проверяет размер, SHA-256 и PE32+ формат launcher-а;
          - обновлятор отказывается ставить пакет без launcher-файлов;
          - после обновления приложение корректно перезапускается.
          EOF
          sed -i 's/^          //' CHANGELOG-14.1.2.md

          cd ..
          rm -f SonochkaStudy-update.zip SonochkaStudy-v14.1.2-portable.zip SonochkaStudy.exe
          (cd app && zip -q -9 ../SonochkaStudy-update.zip SonaStudy.html SonaMusicBridge.ps1 Launch.ps1 SonaUpdater.ps1 startup-chime.wav version.txt CHANGELOG-14.1.2.md SonaStudy.cmd SonochkaStudy.exe)
          cp SonochkaStudy-update.zip SonochkaStudy-v14.1.2-portable.zip
          cp app/SonochkaStudy.exe SonochkaStudy.exe

          unzip -t SonochkaStudy-update.zip
          unzip -l SonochkaStudy-update.zip | grep -q 'SonochkaStudy.exe'
          unzip -l SonochkaStudy-update.zip | grep -q 'SonaStudy.cmd'
          sha256sum SonochkaStudy-update.zip | tee SHA256.txt

      - name: Publish v14.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd build
          gh release create v14.1.2 \
            SonochkaStudy-update.zip \
            SonochkaStudy-v14.1.2-portable.zip \
            SonochkaStudy.exe \
            --repo "${{ github.repository }}" \
            --title "Соночка Study v14.1.2 — исправленный запуск" \
            --notes "Критический hotfix: в GitHub теперь лежит проверенный SonochkaStudy.exe (2560 байт, PE32+), а update ZIP содержит EXE и SonaStudy.cmd. Обновлятор больше не сможет установить неполный пакет."

      - name: Point stable channel to v14.1.2
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(cut -d' ' -f1 build/SHA256.txt)
          cat > stable.json <<EOF
          {
            "version": "14.1.2",
            "packageUrl": "https://github.com/sicinsane/SonochkaStudy/releases/download/v14.1.2/SonochkaStudy-update.zip",
            "sha256": "$HASH",
            "notes": "Исправлен критический баг запуска: update-пакет содержит проверенный SonochkaStudy.exe и SonaStudy.cmd."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.json
          git commit -m "Point stable channel to v14.1.2"
          git push
